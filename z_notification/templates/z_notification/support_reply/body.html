<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f6f7f9;font-family:Segoe UI,Arial,sans-serif;color:#1d2433;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:28px;font-size:15px;line-height:1.55;">
    {% include "z_notification/_brand.html" %}
    <p style="margin:0 0 16px;">Hi {{ first_name }},</p>
    <p style="margin:0 0 12px;">The Zinwe team answered your support request <strong>"{{ ticket.subject }}"</strong>:</p>
    <div style="margin:0 0 20px;padding:14px 16px;border-left:3px solid #FD6D02;background:#f6f7f9;border-radius:4px;white-space:pre-wrap;">{{ message.body }}</div>
    <p style="margin:0 0 20px;"><a href="{{ dashboard_url }}" style="display:inline-block;padding:10px 18px;background:#FD6D02;color:#0d0d0e;border-radius:6px;font-weight:600;text-decoration:none;">Reply in your dashboard</a></p>
    <p style="margin:0;">The Zinwe team<br><span style="color:#6b7280;">SKYTECHNO, New Delhi</span></p>
  </div>
</body>
</html>
